# Run:   kubectl apply -f job.yaml
# Watch: kubectl logs -f job/jax-demo --pod-running-timeout=24h
# Clean: kubectl delete job jax-demo --wait=true
apiVersion: batch/v1
kind: Job
metadata:
  name: jax-demo
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app: jax-demo }
    spec:
      restartPolicy: Never
      tolerations:
        - key: amd.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: train
          # same versions as pytorch example
          image: rocm/dev-ubuntu-24.04:7.2.4-complete
          resources:
            limits:
              amd.com/gpu: 8
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            # https://rocm.docs.amd.com/projects/install-on-linux/en/docs-7.2.4/install/3rd-party/jax-install.html
            - name: LLVM_PATH
              value: "/opt/rocm/llvm"
            - name: JAX_PLATFORMS
              value: "rocm"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
          workingDir: /workspace
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail

              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates git python3 python3-pip python3-venv libdw1

              git clone https://github.com/aklein4/nc-jax-demo.git
              cd nc-jax-demo
              git rev-parse HEAD
              # Ubuntu marks system Python as externally managed.
              python3 -m pip install --break-system-packages "uv==$(cat .uv-version)"
              uv sync --locked --extra rocm --python "$(cat .python-version)"
              exec uv run --no-sync python main.py
      volumes:
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 8Gi }
        - name: shared
          # no `type`: a node without the shared volume must not fail the
          # job — the script checks what is mounted and skips the file
          hostPath:
            path: /mnt/shared
